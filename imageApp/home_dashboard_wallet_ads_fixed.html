<div dir="rtl" style="background: var(--surface-1); border-radius: 20px; padding: 16px; max-width: 340px; margin: 0 auto; font-family: var(--font-sans);">

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div>
      <p style="font-size:13px; color:var(--text-secondary); margin:0;">مساء الخير 👋</p>
      <p style="font-size:18px; font-weight:500; margin:2px 0 0;">مغسلة الأمل</p>
    </div>
    <div style="width:40px; height:40px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;">
      <i class="ti ti-bell" style="font-size:18px; color:var(--text-accent);" aria-hidden="true"></i>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:12px;">
    <div style="background:var(--surface-2); border-radius:12px; padding:12px;">
      <p style="font-size:12px; color:var(--text-secondary); margin:0 0 4px;">إيرادات اليوم</p>
      <p style="font-size:20px; font-weight:500; margin:0;">1,240 ر.س</p>
    </div>
    <div style="background:var(--surface-2); border-radius:12px; padding:12px;">
      <p style="font-size:12px; color:var(--text-secondary); margin:0 0 4px;">فواتير قيد التجهيز</p>
      <p style="font-size:20px; font-weight:500; margin:0;">7</p>
    </div>
  </div>

  <!-- بطاقة المحفظة -->
  <button style="width:100%; text-align:right; background:var(--bg-pro); border-radius:14px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:38px; height:38px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center;">
        <i class="ti ti-wallet" style="font-size:18px; color:var(--text-pro);" aria-hidden="true"></i>
      </div>
      <div>
        <p style="font-size:12px; color:var(--text-secondary); margin:0 0 2px;">رصيد المحفظة</p>
        <p style="font-size:17px; font-weight:600; margin:0; color:var(--text-pro);">95.00 ر.س</p>
      </div>
    </div>
    <i class="ti ti-chevron-left" style="font-size:18px; color:var(--text-pro);" aria-hidden="true"></i>
  </button>

  <!-- إعلان بصورة فقط -->
  <div style="border-radius:14px; overflow:hidden; margin-bottom:12px; position:relative; height:100px; background:linear-gradient(135deg, var(--bg-accent), var(--surface-2)); display:flex; align-items:center; justify-content:center;">
    <i class="ti ti-photo" style="font-size:26px; color:var(--text-muted);" aria-hidden="true"></i>
    <span style="position:absolute; bottom:8px; left:8px; font-size:9px; background:rgba(0,0,0,0.45); color:#fff; padding:2px 8px; border-radius:20px;">إعلان</span>
  </div>
  <div style="display:flex; justify-content:center; gap:4px; margin-bottom:16px;">
    <span style="width:6px; height:6px; border-radius:50%; background:var(--text-pro);"></span>
    <span style="width:6px; height:6px; border-radius:50%; background:var(--border-strong);"></span>
    <span style="width:6px; height:6px; border-radius:50%; background:var(--border-strong);"></span>
  </div>

  <p style="font-size:13px; color:var(--text-secondary); margin:0 0 8px;">وصول سريع</p>
  <div style="display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-bottom:20px;">
    <button style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 2px; border-radius:12px;">
      <i class="ti ti-file-plus" style="font-size:18px;" aria-hidden="true"></i>
      <span style="font-size:10px;">فاتورة</span>
    </button>
    <button style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 2px; border-radius:12px;">
      <i class="ti ti-users" style="font-size:18px;" aria-hidden="true"></i>
      <span style="font-size:10px;">العملاء</span>
    </button>
    <button style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 2px; border-radius:12px;">
      <i class="ti ti-calendar" style="font-size:18px;" aria-hidden="true"></i>
      <span style="font-size:10px;">الحجوزات</span>
    </button>
    <button style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 2px; border-radius:12px;">
      <i class="ti ti-chart-bar" style="font-size:18px;" aria-hidden="true"></i>
      <span style="font-size:10px;">التقارير</span>
    </button>
    <button style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 2px; border-radius:12px;">
      <i class="ti ti-speakerphone" style="font-size:18px;" aria-hidden="true"></i>
      <span style="font-size:10px;">العروض</span>
    </button>
  </div>

  <div style="display:flex; justify-content:space-around; border-top:0.5px solid var(--border); padding-top:10px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
      <i class="ti ti-home" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i>
      <span style="font-size:10px; color:var(--text-accent);">الرئيسية</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
      <i class="ti ti-receipt" style="font-size:20px; color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:10px; color:var(--text-muted);">الفواتير</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
      <i class="ti ti-message-circle" style="font-size:20px; color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:10px; color:var(--text-muted);">المحادثات</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
      <i class="ti ti-settings" style="font-size:20px; color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:10px; color:var(--text-muted);">الإعدادات</span>
    </div>
  </div>

</div>
