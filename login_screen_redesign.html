<div dir="rtl" style="background: var(--surface-1); border-radius: 20px; padding: 20px; max-width: 340px; margin: 0 auto; font-family: var(--font-sans);">

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
    <button style="display:flex; align-items:center; gap:4px; padding:6px 10px; border-radius:20px; font-size:12px; background:var(--surface-2);">
      <i class="ti ti-language" style="font-size:15px;" aria-hidden="true"></i>
      <span>عربي</span>
    </button>
    <button style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; background:var(--surface-2);" aria-label="تبديل الثيم">
      <i class="ti ti-moon" style="font-size:16px;" aria-hidden="true"></i>
    </button>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:24px;">
    <div style="width:76px; height:76px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center; margin-bottom:12px;">
      <i class="ti ti-wash-machine" style="font-size:34px; color:var(--text-accent);" aria-hidden="true"></i>
    </div>
    <p style="font-size:18px; font-weight:500; margin:0 0 4px;">مغسلتي اس بلس</p>
    <p style="font-size:13px; color:var(--text-secondary); margin:0;">هلا بك في مغسلتي اس بلس</p>
  </div>

  <div style="background:var(--surface-2); border-radius:14px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:40px; height:40px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; color:var(--text-accent);">أع</div>
      <div>
        <p style="font-size:14px; font-weight:500; margin:0;">أحمد الغامدي</p>
        <p style="font-size:12px; color:var(--text-muted); margin:2px 0 0;">555547603</p>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button style="display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px;" aria-label="مسح QR">
        <i class="ti ti-qrcode" style="font-size:16px;" aria-hidden="true"></i>
      </button>
      <button style="display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; color:var(--text-danger);" aria-label="حذف الحساب">
        <i class="ti ti-trash" style="font-size:16px;" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:8px;">
    <div style="flex:1; background:var(--surface-2); border-radius:12px; padding:2px 14px; display:flex; align-items:center; height:44px;">
      <i class="ti ti-lock" style="font-size:16px; color:var(--text-muted); margin-left:8px;" aria-hidden="true"></i>
      <input type="password" placeholder="كلمة المرور" style="border:none; background:transparent; flex:1; height:100%; font-size:13px;" />
      <i class="ti ti-eye-off" style="font-size:16px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>
    <button style="width:44px; height:44px; border-radius:12px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;" aria-label="الدخول بالبصمة">
      <i class="ti ti-fingerprint" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i>
    </button>
  </div>

  <p style="font-size:12px; color:var(--text-accent); text-align:left; margin:0 0 10px;">هل نسيت كلمة السر؟</p>

  <label style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); margin-bottom:18px;">
    <input type="checkbox" style="width:15px; height:15px;" />
    الدخول بدون انترنت
  </label>

  <button style="width:100%; height:46px; border-radius:12px; background:var(--fill-primary); color:var(--on-primary); font-size:14px; font-weight:500; margin-bottom:14px;">تسجيل الدخول</button>

  <button style="width:100%; height:44px; border-radius:12px; background:transparent; border:0.5px solid var(--border-strong); font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:20px;">
    <i class="ti ti-user-plus" style="font-size:16px;" aria-hidden="true"></i>
    إنشاء حساب
  </button>

  <div style="display:flex; justify-content:center; gap:28px; border-top:0.5px solid var(--border); padding-top:14px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <i class="ti ti-headset" style="font-size:18px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:11px; color:var(--text-secondary);">تواصل معنا</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <i class="ti ti-info-circle" style="font-size:18px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:11px; color:var(--text-secondary);">تعرف من نحن</span>
    </div>
  </div>

</div>
